name: Bug report
description: Something Taut did wrong, or an error that left you without a next step
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove real data before you post.** No message content, tenant IDs, user names, email addresses, tokens or certificates.
        Security problems do not belong here; see the security policy.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The command and its output, redacted. For a failed run, include `taut status` and the relevant `taut audit` entries.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `taut doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From `taut --version`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it ran
      options:
        - Local stack with the fake services (make up)
        - Docker Compose against a real tenant
        - Kubernetes (Helm chart) against a real tenant
        - Other
    validations:
      required: true
  - type: dropdown
    id: cloud
    attributes:
      label: Microsoft cloud
      options:
        - Not applicable (fakes)
        - Global
        - GCC / GCC High / DoD
        - China (21Vianet)
  - type: checkboxes
    id: redacted
    attributes:
      label: Before submitting
      options:
        - label: I removed message content, identifiers and secrets from everything above.
          required: true
