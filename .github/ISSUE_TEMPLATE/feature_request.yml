name: Feature request
description: Something a migration needs that Taut does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The migration problem
      description: What you are trying to move or do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like Taut to do
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to work on this.
