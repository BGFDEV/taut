{{- $np := .Values.networkPolicy }}
{{- if $np.enabled }}

# Every pod of this release: nothing in, nothing out, unless a policy below
# allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taut.fullname" . }}-default-deny
  labels:
    {{- include "taut.labels" (dict "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taut.releaseSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
# Controller: reached by operators only; talks to Postgres, NATS and staging.
# Workers never call it (they coordinate through Postgres and NATS). It has
# no reason to call Microsoft or Slack and holds no credential for either,
# but this policy alone does not keep it off the internet: a dependency
# whose `to` list is empty may be anywhere among the public IPv4 addresses
# on its port (443 for staging by default). Set networkPolicy.s3.to,
# .postgres.to and .nats.to to close that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taut.fullname" . }}-controller
  labels:
    {{- include "taut.labels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taut.selectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with $np.controllerIngressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.controller.port }}
  {{- end }}
  egress:
    {{- include "taut.npCommonEgress" . | nindent 4 }}
    {{- with $np.controllerExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Worker pods: nothing may connect to them. Out: Postgres, NATS, staging,
# and what the egress proxy and the token broker need on the internet.
# Private, link-local and carrier-grade NAT ranges are reachable only
# through a dependency's own `to` list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taut.fullname" . }}-worker
  labels:
    {{- include "taut.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taut.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "taut.npCommonEgress" . | nindent 4 }}
    {{- if not $np.cilium.enabled }}
    # Microsoft Graph, SharePoint, Entra sign-in, Slack.
    - to:
        {{- range $np.workerExternalEgress.cidrs }}
        - ipBlock:
            cidr: {{ . }}
            {{- $except := list }}
            {{- if not (contains ":" .) }}
            {{- $except = $np.workerExternalEgress.except }}
            {{- end }}
            {{- if and $except (hasSuffix "/0" .) }}
            except:
              {{- toYaml $except | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        {{- range $np.workerExternalEgress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $np.workerExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
