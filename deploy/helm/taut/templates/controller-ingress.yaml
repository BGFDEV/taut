{{- $ing := .Values.controller.ingress }}
{{- if $ing.enabled }}
{{- if not $ing.hosts }}
{{- fail "\n\ncontroller.ingress.enabled is true but controller.ingress.hosts is empty. Add at least one host." }}
{{- end }}
{{- $ctx := dict "root" . "component" "controller" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "taut.fullname" . }}-controller
  labels:
    {{- include "taut.labels" $ctx | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $ing.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (default (list (dict "path" "/" "pathType" "Prefix")) .paths) }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "taut.fullname" $ }}-controller
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
