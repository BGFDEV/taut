{{- range $component := list "controller" "worker" }}
{{- $sa := (index $.Values $component).serviceAccount }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taut.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "taut.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in Taut talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
{{- end }}
