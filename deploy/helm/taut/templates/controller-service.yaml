{{- $ctx := dict "root" . "component" "controller" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taut.fullname" . }}-controller
  labels:
    {{- include "taut.labels" $ctx | nindent 4 }}
  {{- with .Values.controller.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controller.service.type }}
  ports:
    - name: http
      port: {{ .Values.controller.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "taut.selectorLabels" $ctx | nindent 4 }}
