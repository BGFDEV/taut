{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
# DEVELOPMENT ONLY: created from plaintext values (secrets.create=true).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taut.devSecretName" . }}
  labels:
    {{- include "taut.labels" (dict "root" .) | nindent 4 }}
  annotations:
    taut.dev/warning: "Created from plaintext Helm values. Development only."
type: Opaque
stringData:
  {{- with $s.postgresUrl }}
  {{ $.Values.postgres.key }}: {{ . | quote }}
  {{- end }}
  {{- with $s.stagingKey }}
  {{ $.Values.stagingKey.key }}: {{ . | quote }}
  {{- end }}
  {{- with $s.controllerToken }}
  {{ $.Values.controllerToken.key }}: {{ . | quote }}
  {{- end }}
  {{- with $s.s3AccessKey }}
  {{ $.Values.s3.accessKeyKey }}: {{ . | quote }}
  {{- end }}
  {{- with $s.s3SecretKey }}
  {{ $.Values.s3.secretKeyKey }}: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.entra.credential.type "certificate" }}
  {{- with $s.entraCertificate }}
  {{ include "taut.entraKey" $ }}: {{ . | quote }}
  {{- end }}
  {{- else }}
  {{- with $s.entraClientSecret }}
  {{ include "taut.entraKey" $ }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with $s.slackToken }}
  {{ $.Values.slack.token.key }}: {{ . | quote }}
  {{- end }}
{{- end }}
