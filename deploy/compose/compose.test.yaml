# Throwaway backing services for integration tests.
#
#   make test-services       start (ports differ from the dev stack's)
#   make test-services-down  stop and delete
#
# Tests that need Postgres or S3 read TAUT_TEST_DATABASE_URL and
# TAUT_TEST_S3_ENDPOINT, and skip when they are unset.

name: taut-test

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: taut
      POSTGRES_PASSWORD: taut-test
      POSTGRES_DB: taut_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taut -d taut_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: taut-test
      RUSTFS_SECRET_KEY: taut-test-secret
    ports: ["127.0.0.1:59000:9000"]

  nats:
    image: nats:2.15-alpine
    ports: ["127.0.0.1:54222:4222"]
