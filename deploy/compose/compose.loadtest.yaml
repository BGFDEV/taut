# Additions to the local stack for `make load-test` (scripts/load-test.sh).
# Not used by `make up`.
#
#   docker compose -f compose.yaml -f compose.loadtest.yaml --profile w8 up -d
#
# It changes three things about the stack and adds workers:
#
#   postgres    loads pg_stat_statements, so the report can name the
#               statements the time went into, and allows more connections
#   telemetry   keeps metrics and drops traces: printing every span of a
#               large import to the collector's log would measure the log
#   workers     c and d with the profile w4, c to h with w8, each a pod of
#               three like a and b

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - max_connections=300

  telemetry:
    volumes: ["./otel-collector.loadtest.yaml:/etc/otelcol/config.yaml:ro"]

  worker-c:
    extends: { file: compose.yaml, service: worker-a }
    profiles: [w4, w8]
    environment:
      TAUT_PROXY_URL: http://egress-proxy-c:8900
    depends_on:
      controller: { condition: service_healthy }
      egress-proxy-c: { condition: service_started }

  egress-proxy-c:
    extends: { file: compose.yaml, service: egress-proxy-a }
    profiles: [w4, w8]
    volumes: [token-broker-c:/home/nonroot]
    depends_on:
      token-broker-c: { condition: service_started }
      nats: { condition: service_healthy }

  token-broker-c:
    extends: { file: compose.yaml, service: token-broker-a }
    profiles: [w4, w8]
    volumes: [token-broker-c:/home/nonroot]

  worker-d:
